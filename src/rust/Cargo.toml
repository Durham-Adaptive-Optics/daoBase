[package]
name = "dao"
version = "0.1.0"
edition = "2021"
description = "Rust bindings for daoBase's SHM interface (libdao)"

[build-dependencies]
# Generates the raw FFI layer from daoBase/include/dao.h at build time, so
# the struct layouts (IMAGE, IMAGE_METADATA, ...) can never drift from the
# real C header. Requires libclang to be installed (see ../../README.md /
# the crate's own README.md for the package name on your platform).
bindgen = "0.70"
