# JuliaFormatter configuration for daoBase
# Applied by: using JuliaFormatter; format(".")

style = "default"
indent = 4
margin = 140
always_use_return = false
whitespace_typedefs = false
whitespace_ops_in_indices = true
remove_extra_newlines = true
import_to_using = false
pipe_to_function_call = false
short_to_long_block_threshold = 5
long_to_short_block_threshold = -1
always_for_in = false
normalize_line_endings = "unix"
